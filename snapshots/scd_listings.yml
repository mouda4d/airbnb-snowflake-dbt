snapshots:
  - name: scd_listings
    relation: ref('silver_listings')
    description: "SCD2 history of listings, tracks changes to price, room type and capacity over time"
    config:
      unique_key: listing_id
      strategy: check
      check_cols: 
      - price_per_night
      - room_type
      - accommodates
      dbt_valid_to_current: "to_date('9999-12-31')"