snapshots:
  - name: scd_hosts
    relation: ref('silver_hosts')
    description: "SCD2 history of hosts, tracks changes to is_superhost and response_rate over time"
    config:
      unique_key: host_id
      strategy: check
      check_cols:
      - is_superhost
      - response_rate
      dbt_valid_to_current: "to_date('9999-12-31')"